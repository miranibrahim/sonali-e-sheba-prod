<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sonali e-Wallet | Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">

  <div class="phone-frame">
    <div class="screen login-screen">
      <div class="login-content">
        <div class="brand">
          <div class="brand-icon"><i class="fa-solid fa-sun"></i></div>
          <h1>Sonali e-Wallet</h1>
        </div>

        <form id="loginForm" class="login-form">
          <div class="input-group">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <input type="tel" id="phone" placeholder="Enter Phone Number" autocomplete="off" required />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="pin" inputmode="numeric" placeholder="Enter PIN Number" autocomplete="off" required />
          </div>

          <button type="submit" class="btn-login">LOGIN</button>
        </form>

        <p class="register-text">Don't have any account?<br><a href="#" id="registerLink">Register</a></p>
      </div>

      <div class="login-footer">
        <div class="footer-item">
          <i class="fa-solid fa-building-columns"></i>
          <span>Branch<br>Locations</span>
        </div>
        <div class="footer-item">
          <i class="fa-solid fa-money-check-dollar"></i>
          <span>ATM<br>Locations</span>
        </div>
        <div class="footer-item">
          <i class="fa-solid fa-headset"></i>
          <span>Help &<br>Support</span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
